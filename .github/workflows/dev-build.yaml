name: Docker Build

on:
  push:
    branches:
      - main

permissions:
    packages: write
    contents: read

jobs:
  build-dev:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@e4c1c000c95f9cc255f72940e9c56bcbd1239436 # v1

      - name: Set image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push canary image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE }}:canary
            ghcr.io/${{ env.IMAGE }}:canary-${{ github.sha }}
          platforms: linux/amd64,linux/arm64

